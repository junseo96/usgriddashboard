name: Grid Atlas checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/grid-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: Acquire public Northeast operational sources
        run: python3 scripts/transmission_northeast.py --start 2026-09-13 --end 2026-10-12 --output data/northeast-runner.json
      - name: Preserve original bytes and derived observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transmission-public-source-evidence
          path: |
            apps/grid-atlas/data/northeast-runner.json
            apps/grid-atlas/.local/transmission/northeast/
          include-hidden-files: true
          retention-days: 30
